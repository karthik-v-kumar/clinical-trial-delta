[project]
name = "clinical-trial-delta"
version = "0.1.0"
description = "Daily snapshots and change feed for ClinicalTrials.gov trials in GLP-1/obesity, type 2 diabetes and cholesterol."
requires-python = ">=3.11"
# The pipeline uses the standard library only; pytest is the sole dev dependency (requirements-dev.txt).

[tool.pytest.ini_options]
testpaths = ["pipeline"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# Prompt text, hand-written golden cases and test fixtures read better unwrapped.
"pipeline/test_*.py" = ["E731", "E501"]
"pipeline/ai.py" = ["E501"]
"evals/build_golden.py" = ["E501"]
