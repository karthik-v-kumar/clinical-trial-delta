# Daily refresh (mirrors financial-research-hub's refresh.yml): the only
# recurring compute in this project. Runs on GitHub's runners with the repo's
# own GITHUB_TOKEN; no personal agent allowance is involved.
#
# AI summaries and the eval judge call an OpenAI-compatible LLM provider set
# in the repository settings (Settings > Secrets and variables > Actions):
#   secret   LLM_API_KEY                     the provider key; never in the repo
#   variable LLM_BASE_URL, LLM_MODEL         required
#   variable JUDGE_MODEL, LLM_PROVIDER, LLM_MIN_INTERVAL, LLM_REASONING_EFFORT,
#            SUMMARY_BUDGET, EVAL_GENERATION_BUDGET, EVAL_JUDGE_BUDGET  optional
# Until those are set, both steps report "not run" and the site says so.
# (GitHub Models, used at first, was retired by GitHub on 2026-07-30.)
name: Daily refresh

on:
  schedule:
    # 17:41 UTC = 09:41 PST / 10:41 PDT, after ClinicalTrials.gov's daily data
    # refresh and off the top of the hour, when Actions queues are busiest.
    - cron: "41 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode (see pipeline/run.py)"
        type: choice
        options:
          - daily
          - rebuild
        default: daily

permissions:
  contents: write

# Queue runs, never overlap, so two runs can't interleave pushes to main.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ inputs.mode || 'daily' }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MIN_INTERVAL: ${{ vars.LLM_MIN_INTERVAL }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Never commit data from a pipeline whose differ or writer-allowlist tests fail.
      - name: Unit tests
        run: python -m pytest -q

      # daily: fetch -> normalize -> snapshot -> diff -> write data/. A failed
      # query or bad record marks its collection partial and the run continues
      # (warning annotation + meta.json). It does nothing if today's snapshot
      # exists. rebuild: re-write the site files from the latest snapshot only.
      - name: Run pipeline (${{ env.MODE }})
        run: python -m pipeline.run "$MODE"

      # Plain-language summaries for new or changed records only, within a
      # request budget that keeps the free tier's daily limit in reach. Every
      # summary must pass the assertions before it is published.
      - name: AI summaries (changed records only)
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SUMMARY_BUDGET: ${{ vars.SUMMARY_BUDGET }}
        run: python -m pipeline.summarize

      # Eval assertions on every refresh; failures show on the site's Evals page
      # and as warnings here. The judge reuses cached scores for unchanged outputs.
      - name: Evals
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          EVAL_GENERATION_BUDGET: ${{ vars.EVAL_GENERATION_BUDGET }}
          EVAL_JUDGE_BUDGET: ${{ vars.EVAL_JUDGE_BUDGET }}
        run: python -m pipeline.evals

      # Acceptance check, logged every run: pipeline counts vs the
      # ClinicalTrials.gov website and API. Never blocks the data commit.
      - name: Reconcile counts with ClinicalTrials.gov
        if: env.MODE == 'daily'
        continue-on-error: true
        run: python -m pipeline.reconcile

      # This push to main is what redeploys the site (Vercel, from M2).
      - name: Commit data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          if [ "$MODE" = "daily" ]; then label="daily refresh"; else label="$MODE"; fi
          git commit -q -m "data: ${label} $(TZ=America/Los_Angeles date +%F)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push failed (attempt ${attempt}); rebasing and retrying."
            sleep $((2 ** attempt))
            git pull --rebase origin main
          done
          exit 1
