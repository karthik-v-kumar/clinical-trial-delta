name: Tests

on:
  push:
    paths:
      - "pipeline/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "pipeline/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
