name: Tests

on:
  push:
    paths:
      - "pipeline/**"
      - "web/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "pipeline/**"
      - "web/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Type-check, and fail if any page could request anything other than the
      # site's own /data/*.json files (no LLM or API calls at view time).
      - run: npm run check
      - run: npm run build
