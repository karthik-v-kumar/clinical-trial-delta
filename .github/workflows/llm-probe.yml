# Manual check of the AI provider (never prints the key). Lists the models the
# key can use; then, if LLM_MODEL is set, sends one small request to LLM_MODEL
# and one to JUDGE_MODEL and prints what came back. Run it after setting the
# LLM_API_KEY secret and the LLM_BASE_URL variable, again after choosing
# LLM_MODEL, and whenever the AI steps report errors.
name: LLM probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe the provider
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
        run: python -m pipeline.llm --probe
