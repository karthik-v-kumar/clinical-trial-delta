# Manual check of the AI provider (never prints the key). Lists the models the
# key can use; then sends one small request to LLM_MODEL, JUDGE_MODEL and any
# model IDs typed into the "models" input, and prints what came back. Run it
# after setting the LLM_API_KEY secret and LLM_BASE_URL, to try models before
# changing a variable, and whenever the AI steps report errors.
name: LLM probe

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Other model IDs to try, space-separated (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe the provider
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
          LLM_PROBE_MODELS: ${{ inputs.models }}
        run: python -m pipeline.llm --probe
